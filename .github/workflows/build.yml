name: Build
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      deploy_linux_amd64:
        description: 'Deploy linux-amd64'
        type: boolean
        default: true
      deploy_linux_arm64:
        description: 'Deploy linux-arm64'
        type: boolean
        default: true
      deploy_windows_386:
        description: 'Deploy windows-386'
        type: boolean
        default: true
      deploy_windows_amd64:
        description: 'Deploy windows-amd64'
        type: boolean
        default: true
      deploy_darwin_amd64:
        description: 'Deploy darwin-amd64'
        type: boolean
        default: true
      deploy_darwin_arm64:
        description: 'Deploy darwin-arm64'
        type: boolean
        default: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-latest
            container: debian:bullseye
          - os: linux
            arch: arm64
            runner: ubuntu-22.04-arm
            container: debian:bullseye
          - os: windows
            arch: 386
            runner: windows-latest
          - os: windows
            arch: amd64
            runner: windows-latest
          - os: darwin
            arch: amd64
            runner: macos-15-intel
          - os: darwin
            arch: arm64
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container || '' }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Install build deps (Linux container)
        if: matrix.container
        run: apt-get update && apt-get install -y cmake g++ make curl bzip2 tar ca-certificates file
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Set WD for Git Bash (Windows)
        if: matrix.os == 'windows'
        run: echo "WD=$(cygpath -m "$(dirname "$(which sh)")")/" >> $GITHUB_ENV
      - run: node release/ci-compile.js ${{ matrix.os }} ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: broth-${{ matrix.os }}-${{ matrix.arch }}
          path: broth/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    environment: production
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
      - run: release/ci-deploy-itchio.sh
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          DEPLOY_LINUX_AMD64: ${{ github.event.inputs.deploy_linux_amd64 }}
          DEPLOY_LINUX_ARM64: ${{ github.event.inputs.deploy_linux_arm64 }}
          DEPLOY_WINDOWS_386: ${{ github.event.inputs.deploy_windows_386 }}
          DEPLOY_WINDOWS_AMD64: ${{ github.event.inputs.deploy_windows_amd64 }}
          DEPLOY_DARWIN_AMD64: ${{ github.event.inputs.deploy_darwin_amd64 }}
          DEPLOY_DARWIN_ARM64: ${{ github.event.inputs.deploy_darwin_arm64 }}
