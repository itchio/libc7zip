name: Build
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      deploy_linux_amd64:
        description: 'Deploy linux-amd64'
        type: boolean
        default: true
      deploy_linux_arm64:
        description: 'Deploy linux-arm64'
        type: boolean
        default: true
      deploy_windows_386:
        description: 'Deploy windows-386'
        type: boolean
        default: true
      deploy_windows_amd64:
        description: 'Deploy windows-amd64'
        type: boolean
        default: true
      deploy_windows_arm64:
        description: 'Deploy windows-arm64'
        type: boolean
        default: true
      deploy_darwin_amd64:
        description: 'Deploy darwin-amd64'
        type: boolean
        default: true
      deploy_darwin_arm64:
        description: 'Deploy darwin-arm64'
        type: boolean
        default: true
      user_version:
        description: 'Version override (e.g. "1.2.3") - if set, deploys as stable release instead of head'
        type: string
        required: false

jobs:
  choose-builds:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - id: set-matrix
        run: release/ci-choose-builds.sh
        env:
          EVENT_NAME: ${{ github.event_name }}
          DEPLOY_LINUX_AMD64: ${{ inputs.deploy_linux_amd64 }}
          DEPLOY_LINUX_ARM64: ${{ inputs.deploy_linux_arm64 }}
          DEPLOY_WINDOWS_386: ${{ inputs.deploy_windows_386 }}
          DEPLOY_WINDOWS_AMD64: ${{ inputs.deploy_windows_amd64 }}
          DEPLOY_WINDOWS_ARM64: ${{ inputs.deploy_windows_arm64 }}
          DEPLOY_DARWIN_AMD64: ${{ inputs.deploy_darwin_amd64 }}
          DEPLOY_DARWIN_ARM64: ${{ inputs.deploy_darwin_arm64 }}

  build:
    needs: choose-builds
    if: ${{ needs.choose-builds.outputs.matrix != '{"include":[]}' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.choose-builds.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container || '' }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Install build deps (Linux container)
        if: matrix.container
        run: apt-get update && apt-get install -y cmake g++ make curl xz-utils tar ca-certificates file
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Set WD for Git Bash (Windows)
        if: matrix.os == 'windows'
        run: echo "WD=$(cygpath -m "$(dirname "$(which sh)")")/" >> $GITHUB_ENV
      - name: Compile
        run: node release/ci-compile.js ${{ matrix.os }} ${{ matrix.arch }}
      - name: Run Tests
        run: node release/ci-test.js ${{ matrix.os }} ${{ matrix.arch }}
      - uses: actions/upload-artifact@v6
        with:
          name: broth-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.os == 'windows' && '-unsigned' || '' }}
          path: broth/${{ matrix.os }}-${{ matrix.arch }}/

  sign-windows:
    needs: build
    if: github.event_name == 'workflow_dispatch' && (github.event.inputs.deploy_windows_386 == 'true' || github.event.inputs.deploy_windows_amd64 == 'true' || github.event.inputs.deploy_windows_arm64 == 'true')
    runs-on: windows-latest
    environment: signing-windows
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: 386
          - arch: amd64
          - arch: arm64
    steps:
      - name: Check if signing requested
        id: check
        shell: bash
        run: |
          case "${{ matrix.arch }}" in
            386)   echo "should_sign=${{ github.event.inputs.deploy_windows_386 }}" >> $GITHUB_OUTPUT ;;
            amd64) echo "should_sign=${{ github.event.inputs.deploy_windows_amd64 }}" >> $GITHUB_OUTPUT ;;
            arm64) echo "should_sign=${{ github.event.inputs.deploy_windows_arm64 }}" >> $GITHUB_OUTPUT ;;
          esac

      - name: Download unsigned artifact
        if: steps.check.outputs.should_sign == 'true'
        uses: actions/download-artifact@v6
        with:
          name: broth-windows-${{ matrix.arch }}-unsigned
          path: broth-windows-${{ matrix.arch }}/

      - name: Sign DLLs with Azure
        if: steps.check.outputs.should_sign == 'true'
        uses: azure/artifact-signing-action@v1
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://wus2.codesigning.azure.net
          signing-account-name: itchio
          certificate-profile-name: itchio
          files: |
            ${{ github.workspace }}/broth-windows-${{ matrix.arch }}/c7zip.dll
            ${{ github.workspace }}/broth-windows-${{ matrix.arch }}/7z.dll
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify signatures
        if: steps.check.outputs.should_sign == 'true'
        shell: pwsh
        run: |
          $dlls = @("c7zip.dll", "7z.dll")
          foreach ($dll in $dlls) {
            $path = "broth-windows-${{ matrix.arch }}/$dll"
            $sig = Get-AuthenticodeSignature -FilePath $path
            $sig | Format-List *
            if ($sig.Status -ne "Valid") {
              Write-Error "Signature verification failed for $dll : $($sig.Status)"
              exit 1
            }
            Write-Host "$dll signature verified successfully"
          }

      - name: Upload signed artifact
        if: steps.check.outputs.should_sign == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: broth-windows-${{ matrix.arch }}
          path: broth-windows-${{ matrix.arch }}/

  deploy:
    needs: [build, sign-windows]
    runs-on: ubuntu-latest
    if: |
      always() &&
      github.event_name == 'workflow_dispatch' &&
      needs.build.result == 'success' &&
      (needs.sign-windows.result == 'success' || needs.sign-windows.result == 'skipped')
    environment: production
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v6
      - run: release/ci-deploy-itchio.sh
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          DEPLOY_LINUX_AMD64: ${{ github.event.inputs.deploy_linux_amd64 }}
          DEPLOY_LINUX_ARM64: ${{ github.event.inputs.deploy_linux_arm64 }}
          DEPLOY_WINDOWS_386: ${{ github.event.inputs.deploy_windows_386 }}
          DEPLOY_WINDOWS_AMD64: ${{ github.event.inputs.deploy_windows_amd64 }}
          DEPLOY_WINDOWS_ARM64: ${{ github.event.inputs.deploy_windows_arm64 }}
          DEPLOY_DARWIN_AMD64: ${{ github.event.inputs.deploy_darwin_amd64 }}
          DEPLOY_DARWIN_ARM64: ${{ github.event.inputs.deploy_darwin_arm64 }}
          USER_VERSION_OVERRIDE: ${{ github.event.inputs.user_version }}
