name: Build
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      deploy_linux_amd64:
        description: 'Deploy linux-amd64'
        type: boolean
        default: true
      deploy_linux_arm64:
        description: 'Deploy linux-arm64'
        type: boolean
        default: true
      deploy_windows_386:
        description: 'Deploy windows-386'
        type: boolean
        default: true
      deploy_windows_amd64:
        description: 'Deploy windows-amd64'
        type: boolean
        default: true
      deploy_darwin_amd64:
        description: 'Deploy darwin-amd64'
        type: boolean
        default: true
      deploy_darwin_arm64:
        description: 'Deploy darwin-arm64'
        type: boolean
        default: true
      user_version:
        description: 'Version override (e.g. "1.2.3") - if set, deploys as stable release instead of head'
        type: string
        required: false

jobs:
  choose-builds:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          all_builds='[
            {"os":"linux","arch":"amd64","runner":"ubuntu-latest","container":"debian:bullseye"},
            {"os":"linux","arch":"arm64","runner":"ubuntu-22.04-arm","container":"debian:bullseye"},
            {"os":"windows","arch":"386","runner":"windows-latest","container":""},
            {"os":"windows","arch":"amd64","runner":"windows-latest","container":""},
            {"os":"darwin","arch":"amd64","runner":"macos-15-intel","container":""},
            {"os":"darwin","arch":"arm64","runner":"macos-latest","container":""}
          ]'

          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            matrix="$all_builds"
          else
            matrix=$(echo "$all_builds" | jq -c '[.[] | select(
              (.os == "linux" and .arch == "amd64" and $linux_amd64 == "true") or
              (.os == "linux" and .arch == "arm64" and $linux_arm64 == "true") or
              (.os == "windows" and .arch == "386" and $windows_386 == "true") or
              (.os == "windows" and .arch == "amd64" and $windows_amd64 == "true") or
              (.os == "darwin" and .arch == "amd64" and $darwin_amd64 == "true") or
              (.os == "darwin" and .arch == "arm64" and $darwin_arm64 == "true")
            )]' \
              --arg linux_amd64 "${{ inputs.deploy_linux_amd64 }}" \
              --arg linux_arm64 "${{ inputs.deploy_linux_arm64 }}" \
              --arg windows_386 "${{ inputs.deploy_windows_386 }}" \
              --arg windows_amd64 "${{ inputs.deploy_windows_amd64 }}" \
              --arg darwin_amd64 "${{ inputs.deploy_darwin_amd64 }}" \
              --arg darwin_arm64 "${{ inputs.deploy_darwin_arm64 }}")
          fi

          echo "matrix={\"include\":$matrix}" >> $GITHUB_OUTPUT

  build:
    needs: choose-builds
    if: ${{ needs.choose-builds.outputs.matrix != '{"include":[]}' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.choose-builds.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container || '' }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Install build deps (Linux container)
        if: matrix.container
        run: apt-get update && apt-get install -y cmake g++ make curl bzip2 tar ca-certificates file
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Set WD for Git Bash (Windows)
        if: matrix.os == 'windows'
        run: echo "WD=$(cygpath -m "$(dirname "$(which sh)")")/" >> $GITHUB_ENV
      - name: Compile
        run: node release/ci-compile.js ${{ matrix.os }} ${{ matrix.arch }}
      - name: Run Tests
        run: node release/ci-test.js ${{ matrix.os }} ${{ matrix.arch }}
      - uses: actions/upload-artifact@v6
        with:
          name: broth-${{ matrix.os }}-${{ matrix.arch }}
          path: broth/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    environment: production
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v6
      - run: release/ci-deploy-itchio.sh
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          DEPLOY_LINUX_AMD64: ${{ github.event.inputs.deploy_linux_amd64 }}
          DEPLOY_LINUX_ARM64: ${{ github.event.inputs.deploy_linux_arm64 }}
          DEPLOY_WINDOWS_386: ${{ github.event.inputs.deploy_windows_386 }}
          DEPLOY_WINDOWS_AMD64: ${{ github.event.inputs.deploy_windows_amd64 }}
          DEPLOY_DARWIN_AMD64: ${{ github.event.inputs.deploy_darwin_amd64 }}
          DEPLOY_DARWIN_ARM64: ${{ github.event.inputs.deploy_darwin_arm64 }}
          USER_VERSION_OVERRIDE: ${{ github.event.inputs.user_version }}
